<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實體安全大冒險</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 版面：1280×720 遊戲畫面。上方 HUD（標題＋16 枚附錄A徽章）、左側俯視平面圖（工程師走動）、右側任務卡、下方 RPG 對話框 */
:root {
  --hall: #0B1220;
  --hall-fg: #DCE7F5;
  --hall-dim: #8193AE;
  --hud: #111B2E;
  --panel: #14223A;
  --panel-2: #1B2D4B;
  --panel-line: #2B4166;
  --ink: #0F172A;
  --mint: #16C47F;
  --mint-hi: #2BF0A6;
  --teal: #0C7A63;
  --sun: #FFC53D;
  --alert: #F43F5E;
  --zw: #E2E8F0; --zg: #22C55E; --zy: #FACC15; --zr: #F43F5E;
  --f-display: 'Huninn', 'Noto Sans TC', 'WenQuanYi Zen Hei', sans-serif;
  --f-body: 'Noto Sans TC', 'WenQuanYi Zen Hei', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--hall); color: var(--hall-fg); font-family: var(--f-body); }
* { box-sizing: border-box; }

/* ── 播放器外框 ── */
.player { min-height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; padding: 16px; }
.viewport { width: 100%; max-width: 1280px; aspect-ratio: 16 / 9; position: relative; overflow: hidden; border-radius: 10px; box-shadow: 0 20px 60px rgba(0,0,0,.5); background: var(--hud); }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--hud); }
.controls { width: 100%; max-width: 1280px; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.controls button { font: 600 15px var(--f-body); color: var(--hall-fg); background: #17233A; border: 1px solid #2B3D5E; border-radius: 8px; padding: 8px 12px; cursor: pointer; min-width: 44px; }
.controls button:hover { background: #20304E; }
.controls button:focus-visible, #seek:focus-visible, .chapters button:focus-visible { outline: 2px solid var(--mint-hi); outline-offset: 2px; }
#seek { flex: 1 1 200px; min-width: 0; accent-color: var(--mint); }
.controls a.game { font: 700 14px var(--f-body); color: var(--ink); background: var(--sun); border-radius: 8px; padding: 8px 12px; text-decoration: none; white-space: nowrap; }
#clock { font: 500 14px var(--f-body); color: var(--hall-dim); font-variant-numeric: tabular-nums; min-width: 96px; text-align: right; }
.chapters { width: 100%; max-width: 1280px; display: flex; flex-wrap: wrap; gap: 6px; }
.chapters button { font: 500 13px var(--f-body); color: var(--hall-dim); background: transparent; border: 1px solid #2B3D5E; border-radius: 999px; padding: 4px 10px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
.chapters button i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.chapters button.on { color: var(--ink); background: var(--mint); border-color: var(--mint); }
.start { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; background: rgba(11,18,32,.6); border: 0; cursor: pointer; color: #fff; font-family: var(--f-display); }
.start b { font-size: clamp(20px, 4vw, 38px); font-weight: 400; background: var(--sun); color: var(--ink); padding: .4em 1.1em; border-radius: 999px; box-shadow: 0 6px 0 #B7791F; }
.start span { font: 400 clamp(12px, 1.6vw, 16px) var(--f-body); color: #E5EDF8; }
body.render .player { padding: 0; display: block; }
body.render .viewport { width: 1280px; height: 720px; max-width: none; border-radius: 0; box-shadow: none; }
body.render .controls, body.render .chapters, body.render .start { display: none; }

/* ── HUD ── */
.hud { position: absolute; left: 0; top: 0; width: 1280px; height: 56px; display: flex; align-items: center; gap: 14px; padding: 0 14px; background: linear-gradient(180deg, #16223A, #0F192B); border-bottom: 2px solid #22375A; }
.logo { display: flex; flex-direction: column; line-height: 1.05; min-width: 214px; }
.logo b { font: 400 25px var(--f-display); color: var(--sun); letter-spacing: .04em; text-shadow: 0 2px 0 #7A4A00; }
.logo small { font: 500 11px var(--f-body); color: var(--hall-dim); letter-spacing: .06em; margin-top: 3px; }
.badges { display: flex; gap: 5px; padding: 4px 8px; border-radius: 10px; background: rgba(0,0,0,.25); border: 1px solid #22375A; }
.badges.hl { box-shadow: 0 0 0 3px var(--sun), 0 0 22px rgba(255,197,61,.6); }
.bdg { width: 38px; height: 38px; position: relative; display: flex; align-items: center; justify-content: center; font: 900 12px var(--f-body); color: #4B5D7C; font-variant-numeric: tabular-nums;
  clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); background: #1C2A44; }
.bdg.got { color: #3B2A00; background: linear-gradient(160deg, #FFE48A, #FFC53D 55%, #E39B0B); }
.bdg.got.wide { font-size: 11px; }
.qcount { margin-left: auto; text-align: right; font: 400 22px var(--f-display); color: #fff; line-height: 1.05; }
.qcount small { display: block; font: 500 11px var(--f-body); color: var(--hall-dim); letter-spacing: .08em; }

/* ── 地圖 ── */
.map { position: absolute; left: 0; top: 56px; width: 900px; height: 500px; overflow: hidden; background: #C9D0D4; }
#world { position: absolute; left: 0; top: 0; width: 900px; height: 500px; display: block; }
.ov { position: absolute; left: 0; top: 0; width: 900px; height: 500px; pointer-events: none; }
.rl { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; font: 700 12px/1 var(--f-body); color: var(--ink); background: rgba(255,255,255,.88); border-radius: 6px; padding: 3px 7px 3px 3px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.rl i { font-style: normal; font: 900 10px/1 var(--f-body); padding: 3px 5px; border-radius: 4px; color: #fff; }
.rl.W i { background: #64748B; } .rl.G i { background: #16A34A; } .rl.Y i { background: #CA8A04; } .rl.R i { background: #E11D48; }
.tag { position: absolute; left: 0; top: 0; font: 700 11px/1 var(--f-body); color: #fff; padding: 3px 6px; border-radius: 999px; white-space: nowrap; transform-origin: 50% 100%; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.emo { position: absolute; left: 0; top: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #fff; border: 2.5px solid var(--ink); border-radius: 50%; font: 900 20px/1 var(--f-body); color: var(--alert); transform-origin: 50% 100%; }
.emo::after { content: ''; position: absolute; bottom: -7px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.spark { position: absolute; left: 0; top: 0; width: 70px; height: 70px; margin: -35px 0 0 -35px; border-radius: 50%; border: 4px solid var(--mint-hi); }

.night { position: absolute; inset: 0; background: rgba(12,20,70,.55); pointer-events: none; }
.rain { position: absolute; inset: -40px; pointer-events: none; background-image: repeating-linear-gradient(105deg, rgba(200,225,255,0) 0 22px, rgba(200,225,255,.55) 22px 23.5px, rgba(200,225,255,0) 23.5px 46px); }
.rain.b { background-image: repeating-linear-gradient(105deg, rgba(220,235,255,0) 0 37px, rgba(220,235,255,.4) 37px 38px, rgba(220,235,255,0) 38px 70px); }

.loc { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px; font: 700 14px var(--f-body); color: #fff; background: rgba(15,23,42,.86); border-radius: 10px; padding: 6px 10px; border-left: 6px solid var(--zg); }
.loc small { font-weight: 500; color: #B6C4DA; }
.toast { position: absolute; left: 50%; top: 18px; transform: translateX(-50%); font: 400 24px var(--f-display); padding: 8px 22px; border-radius: 12px; color: var(--ink); white-space: nowrap; border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(15,23,42,.45); }
.toast small { font: 700 14px var(--f-body); margin-left: 10px; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,.93); color: var(--ink); border-radius: 10px; padding: 7px 9px; font: 700 11.5px var(--f-body); transform-origin: 0 100%; box-shadow: 0 2px 6px rgba(0,0,0,.2); }
.legend .r { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.legend .z { display: inline-flex; align-items: center; gap: 3px; }
.legend .z b { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid rgba(0,0,0,.35); display: inline-block; }
.legend svg { width: 13px; height: 13px; vertical-align: -2px; }

/* 表單卡 */
.form { position: absolute; left: 516px; top: 12px; width: 372px; background: #FFFDF6; color: var(--ink); border-radius: 10px; border: 2px solid #1E293B; box-shadow: 0 10px 28px rgba(0,0,0,.35); overflow: hidden; transform-origin: 100% 0; }
.form.l { left: 12px; transform-origin: 0 0; }
.form .fh { display: flex; align-items: center; gap: 8px; padding: 8px 12px; background: #1E293B; color: #fff; }
.form .fh i { font: 900 11px var(--f-body); font-style: normal; background: var(--sun); color: var(--ink); padding: 3px 6px; border-radius: 4px; white-space: nowrap; }
.form .fh b { font: 700 15px var(--f-body); }
.form table { width: 100%; border-collapse: collapse; font: 500 12.5px/1.35 var(--f-body); }
.form td, .form th { border-bottom: 1px solid #E5E0D0; padding: 5px 8px; text-align: left; vertical-align: top; }
.form th { font-weight: 700; background: #F3EEDD; font-size: 11.5px; }
.form td.k { width: 118px; font-weight: 700; color: #475569; background: #FAF6EA; }
.form tr.bad td { background: #FFE4E6; color: #9F1239; font-weight: 700; }
.form tr.ok td:last-child { color: #047857; font-weight: 700; }
.form .ff { padding: 6px 12px; font: 700 11.5px var(--f-body); color: #475569; background: #F3EEDD; }
.form .stamp { position: absolute; right: 14px; bottom: 30px; font: 900 15px var(--f-body); color: #DC2626; border: 3px solid #DC2626; border-radius: 8px; padding: 3px 8px; transform: rotate(-10deg); background: rgba(255,255,255,.75); letter-spacing: .06em; }

/* 監視系統畫面 */
.cctv { position: absolute; right: 12px; top: 12px; width: 420px; background: #0B1220; border: 2px solid #334155; border-radius: 10px; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.4); transform-origin: 100% 0; }
.cctv .h { grid-column: 1 / -1; display: flex; justify-content: space-between; font: 700 12px var(--f-body); color: #93C5FD; }
.cctv .h b { color: #F87171; }
.cctv .cam { position: relative; height: 112px; border-radius: 6px; overflow: hidden; background: #000; }
.cctv .cam svg { width: 100%; height: 100%; display: block; filter: grayscale(1) contrast(1.15) brightness(.95); }
.cctv .cam span { position: absolute; left: 5px; top: 4px; font: 700 10px var(--f-body); color: #fff; background: rgba(0,0,0,.55); padding: 1px 4px; border-radius: 3px; }
.cctv .cam em { position: absolute; right: 5px; bottom: 4px; font: 700 10px var(--f-body); font-style: normal; color: #FCA5A5; }
.log { position: absolute; right: 12px; top: 12px; width: 430px; background: #0B1220; color: #E2E8F0; border: 2px solid #334155; border-radius: 10px; overflow: hidden; box-shadow: 0 10px 28px rgba(0,0,0,.4); transform-origin: 100% 0; }
.log .h { padding: 7px 10px; font: 700 13px var(--f-body); color: #93C5FD; background: #111C33; display: flex; justify-content: space-between; }
.log table { width: 100%; border-collapse: collapse; font: 500 12.5px var(--f-body); font-variant-numeric: tabular-nums; }
.log td { padding: 5px 10px; border-top: 1px solid #1E293B; }
.log tr.alert td { background: rgba(244,63,94,.28); color: #fff; font-weight: 700; }

/* 任務完成 */
.clear { position: absolute; left: 50%; top: 42%; width: max-content; max-width: 860px; transform: translate(-50%, -50%); text-align: center; pointer-events: none; }
.clear b { display: block; font: 400 64px/1 var(--f-display); color: var(--sun); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; letter-spacing: .04em; text-shadow: 0 6px 0 rgba(15,23,42,.5); }
.clear div { margin-top: 10px; display: inline-flex; gap: 8px; background: rgba(15,23,42,.88); padding: 8px 14px; border-radius: 12px; font: 700 16px var(--f-body); color: #fff; align-items: center; }
.clear .bdg { width: 44px; height: 44px; font-size: 13px; }

/* 開場與總結 */
.titleov { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; background: radial-gradient(ellipse at center, rgba(11,18,32,.72), rgba(11,18,32,.25) 70%); }
.titleov h1 { margin: 0; font: 400 76px/1 var(--f-display); color: var(--sun); -webkit-text-stroke: 3px var(--ink); paint-order: stroke fill; text-shadow: 0 7px 0 rgba(0,0,0,.45); }
.titleov p { margin: 0; font: 700 19px var(--f-body); color: #fff; background: rgba(15,23,42,.8); padding: 7px 16px; border-radius: 999px; }
.titleov .zs { display: flex; gap: 8px; }
.titleov .zs span { font: 400 20px var(--f-display); padding: 6px 14px; border-radius: 10px; color: var(--ink); border: 2px solid var(--ink); }
.titleov .press { font: 400 22px var(--f-display); color: var(--mint-hi); letter-spacing: .1em; }
.titleov .kick { font: 700 15px var(--f-body); color: var(--mint-hi); letter-spacing: .06em; background: rgba(15,23,42,.8); padding: 5px 14px; border-radius: 8px; }
.titleov .by { font: 700 15px var(--f-body); color: #fff; background: rgba(15,23,42,.8); padding: 5px 14px; border-radius: 999px; }
.sumov .by { text-align: center; font: 700 13px var(--f-body); color: #B6C4DA; }
.sumov { position: absolute; inset: 0; background: rgba(11,18,32,.82); display: flex; flex-direction: column; justify-content: center; padding: 18px 22px; gap: 10px; }
.sumov h2 { margin: 0; font: 400 34px var(--f-display); color: var(--sun); text-align: center; }
.sumov table { width: 100%; border-collapse: separate; border-spacing: 0 5px; }
.sumov td { background: #F8FAFC; color: var(--ink); font: 500 13.5px/1.4 var(--f-body); padding: 8px 10px; }
.sumov td:first-child { border-radius: 8px 0 0 8px; width: 108px; font: 400 18px var(--f-display); }
.sumov td:last-child { border-radius: 0 8px 8px 0; width: 170px; font-weight: 900; color: #7A4A00; }
.sumov td:nth-child(3) { width: 150px; color: #334155; font-weight: 700; font-size: 12.5px; }
.sumov tr { transition: none; }
.sumov tr.hl td { background: #FFF7D6; }
.sumov .motto { text-align: center; font: 400 24px var(--f-display); color: var(--ink); background: var(--sun); border-radius: 12px; padding: 7px; margin: 2px 120px 0; }

/* ── 任務卡 ── */
.quest { position: absolute; left: 900px; top: 56px; width: 380px; height: 664px; background: var(--panel); border-left: 2px solid #22375A; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
.qh { display: flex; align-items: center; justify-content: space-between; }
.qh .no { font: 400 18px var(--f-display); color: var(--mint-hi); letter-spacing: .08em; }
.zpill { font: 900 12px var(--f-body); color: var(--ink); padding: 4px 9px; border-radius: 999px; border: 2px solid rgba(0,0,0,.25); }
.quest h3 { margin: 0; font: 400 24px/1.2 var(--f-display); color: #fff; }
.meta { display: flex; flex-direction: column; gap: 3px; font: 500 12.5px/1.35 var(--f-body); color: #B6C4DA; }
.meta b { color: var(--sun); font-weight: 700; margin-right: 4px; }
.steps { display: flex; flex-direction: column; gap: 4px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: center; font: 500 13.5px/1.3 var(--f-body); color: #C9D6EA; padding: 3px 6px; border-radius: 7px; }
.steps li .cb { width: 19px; height: 19px; border-radius: 5px; border: 2px solid #4B6189; display: flex; align-items: center; justify-content: center; font: 900 14px/1 var(--f-body); color: var(--ink); }
.steps li.done { color: #fff; }
.steps li.done .cb { background: var(--mint); border-color: var(--mint); }
.steps li.now { background: rgba(43,240,166,.12); }
.sec { display: flex; align-items: center; gap: 8px; font: 700 12px var(--f-body); color: var(--sun); letter-spacing: .06em; margin-top: 2px; }
.sec::after { content: ''; flex: 1; border-top: 1px dashed var(--panel-line); }
.basis { display: flex; flex-direction: column; gap: 5px; }
.bl { display: grid; grid-template-columns: 52px 1fr; gap: 6px; align-items: start; }
.bl > i { font: 700 11.5px/20px var(--f-body); font-style: normal; color: var(--hall-dim); }
.bl p { margin: 0 0 2px; font: 500 12.5px/1.4 var(--f-body); color: #DCE7F5; }
.bl p b { color: #fff; font-weight: 900; margin-right: 4px; }
.bl p em { font-style: normal; color: var(--sun); font-weight: 700; margin-left: 4px; }
.ctl { padding: 6px 8px; border-radius: 8px; background: #12392F; border: 1px solid #1F6B55; }
.ctl b { display: block; font: 900 13.5px/1.3 var(--f-body); color: var(--mint-hi); }
.ctl p { margin: 2px 0 0; font: 500 11.5px/1.45 var(--f-body); color: #CFE9DF; }
.ctl.on { box-shadow: 0 0 0 2px var(--sun); }
.quest.tight { gap: 5px; }
.quest.tight h3 { font-size: 21px; }
.quest.tight .steps li { font-size: 12.5px; padding: 2px 6px; }
.quest.tight .bl p { font-size: 11.5px; line-height: 1.35; }
.quest.tight .ctl { padding: 4px 8px; }
.quest.tight .ctl p { font-size: 11px; line-height: 1.38; }
.quest.tight .chip { font-size: 11px; padding: 4px 6px; }
.credit { margin-top: auto; font: 500 11.5px var(--f-body); color: var(--hall-dim); text-align: right; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 700 12px/1 var(--f-body); padding: 5px 7px; border-radius: 6px; background: var(--panel-2); color: #DCE7F5; border: 1px solid var(--panel-line); white-space: nowrap; }
.chip.f { background: #FFF7D6; color: #5B3B00; border-color: #E8C35A; }
.chip.o { background: #2A1F4A; color: #D8CCFF; border-color: #5B4A9A; }
.qlist { display: flex; flex-direction: column; gap: 3px; }
.qlist div { display: grid; grid-template-columns: 26px 12px 1fr; gap: 7px; align-items: center; font: 500 13px var(--f-body); color: #C9D6EA; }
.qlist div b { font: 400 14px var(--f-display); color: var(--mint-hi); }
.qlist div i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.4); }
.blist { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 8px; }
.blist div { display: grid; grid-template-columns: 34px 1fr; gap: 6px; align-items: center; font: 500 12.5px/1.25 var(--f-body); color: #DCE7F5; }
.blist .bdg { width: 32px; height: 32px; font-size: 10.5px; }

/* ── 對話框 ── */
.dlg { position: absolute; left: 0; top: 556px; width: 900px; height: 164px; background: linear-gradient(180deg, #0F1A2E, #0B1322); border-top: 2px solid #22375A; }
.pt { position: absolute; bottom: 0; width: 164px; height: 160px; }
#pA { left: 2px; } #pR { right: 2px; }
.pt .sprite { position: absolute; left: 0; right: 0; bottom: 0; height: 160px; transform-origin: 50% 100%; }
.pt .face { position: absolute; left: 50%; bottom: 0; height: 100%; width: auto; transform: translateX(-50%); user-select: none; }
.pt .nm { position: absolute; bottom: 4px; left: 50%; transform: translateX(-50%); font: 700 12px var(--f-body); color: #fff; background: rgba(15,23,42,.85); padding: 2px 8px; border-radius: 999px; white-space: nowrap; }
.box { position: absolute; left: 168px; right: 168px; top: 14px; bottom: 10px; border: 3px solid #E2E8F0; border-radius: 14px; background: rgba(20,34,58,.96); padding: 12px 16px 8px; box-shadow: inset 0 0 0 3px #0B1322; }
.box .who { position: absolute; top: -14px; left: 18px; font: 700 14px var(--f-body); color: var(--ink); background: var(--mint-hi); padding: 3px 12px; border-radius: 999px; border: 2px solid #0B1322; }
.box.R .who { left: auto; right: 18px; background: var(--sun); }
.box .txt { font: 400 21px/1.48 var(--f-display); color: #fff; text-wrap: pretty; }
.box .more { position: absolute; right: 16px; bottom: 6px; color: var(--sun); font-size: 16px; }
.progress { position: absolute; left: 0; bottom: 0; height: 5px; background: var(--sun); width: 0; z-index: 5; }
</style>

<div class="player">
  <div class="viewport" id="viewport">
    <div id="stage">
      <header class="hud">
        <div class="logo"><b>實體安全大冒險</b><small>ISO/IEC 27001:2022｜運作流程 A07 實體安全</small></div>
        <div class="badges" id="badges" aria-label="附錄A控制徽章"></div>
        <div class="qcount" id="qcount"></div>

<script>
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const clamp = (v, a = 0, b = 1) => Math.max(a, Math.min(b, v));
const ease = p => 1 - Math.pow(1 - p, 3);
const lerp = (a, b, p) => a + (b - a) * p;
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const RENDER = location.hash === '#render';
if (RENDER) document.body.classList.add('render');

/* 尚未產生旁白時，以字數估算時間軸（方便預覽） */
const TL = typeof TIMING !== 'undefined' ? TIMING : (() => {
  let t = 0;
  return QUESTS.map(sc => {
    const start = t; t += 0.8;
    const lines = sc.lines.map((l, i) => { if (i) t += 0.35; const a = t; t += Math.max(2.2, l.t.length * 0.215); return [+a.toFixed(3), +t.toFixed(3)]; });
    t += 1.0;
    return { start, end: t, lines };

})();

/* 場所、表單、角色與平面圖繪製：見 ../shared/zone-world.js */
const { ZONES, ROOMS, WALLS, GLASS, DOORS, MARKS, NODES, EDGES, ADJ, route, CAMS, BOUNDS, ANNEX, ANNEX_TEXT, OPS, OPS_EN, CREDIT, ANNEX_ORDER, DOCS, FORMS, SKIN, ACTORS, ITEMS, LEGEND_SVG, buildWorld, actorSVG, roomAt } = ZW;

/* ═════════════════════ 4. 依腳本建立時間軸（角色軌跡、旗標、鏡頭） ═════════════════════ */
const SPEED = 150, RUN = 270, GAP = 34;
const FLAG0 = { wb: 0, hud: 0, hl: '', legend: 0, gatealarm: 0, glasshl: 0, blinds: 0, cables: 0, labels: 0, truck: 0, box: 0, boxopen: 0, newsrv: 0, junk: 0, junkhl: 0, sophl: 0,
  upstest: 0, gen: 0, nasfail: 0, nasgone: 0, cage: 0, cctv: 0, log: 0, logalert: 0, night: 0, messy: 0, messyhl: 0, printer: 0, rain: 0, sensors: 0, sandbag: 0, sum: 0, sumrow: 0 };
const nearestNode = p => Object.keys(NODES).reduce((b, k) => (Math.hypot(NODES[k][0] - p[0], NODES[k][1] - p[1]) < Math.hypot(NODES[b][0] - p[0], NODES[b][1] - p[1]) ? k : b), 'car');

let state = { a: {}, f: { ...FLAG0 }, cam: 'all' };
for (const id in ACTORS) state.a[id] = { node: id === 'eng' ? 'car' : 'car', vis: false, item: '', name: ACTORS[id].name };

function posOf(tr, t) {
  let e = null;
  for (const ev of tr.ev) { if (ev.t0 <= t) e = ev; else break; }
  if (!e) return tr.ev[0].p;
  if (e.type === 'tp') return e.p;
  if (e.type === 'move') {
    const d = Math.min(e.len, (t - e.t0) * e.sp);
    return atArc(e.pts, e.cum, d);
  }
  // 跟隨：沿著帶頭者走過的路徑，保持固定距離
  const L = e.leader;
  const a = Math.max(arcOf(L, t) - GAP, e.a0);
  const hp = histAt(L, a);
  const k = ease(clamp((t - e.t0) / 0.6));
  return [lerp(e.p0[0], hp[0], k), lerp(e.p0[1], hp[1], k)];
}
function atArc(pts, cum, d) {
  let i = 1; while (i < pts.length - 1 && cum[i] < d) i++;
  const s = cum[i] - cum[i - 1], p = s ? (d - cum[i - 1]) / s : 1;
  return [lerp(pts[i - 1][0], pts[i][0], clamp(p)), lerp(pts[i - 1][1], pts[i][1], clamp(p))];
}
function arcOf(tr, t) {
  let a = 0;
  for (const ev of tr.ev) {
    if (ev.type !== 'move') continue;
    if (ev.t0 > t) break;
    a = ev.a0 + Math.min(ev.len, (t - ev.t0) * ev.sp);
  }
  return a;
}
function histAt(tr, a) {
  const h = tr.hist;
  if (a <= h[0][2]) return [h[0][0], h[0][1]];
  for (let i = 1; i < h.length; i++) if (h[i][2] >= a) {
    const s = h[i][2] - h[i - 1][2], p = s ? (a - h[i - 1][2]) / s : 1;
    return [lerp(h[i - 1][0], h[i][0], p), lerp(h[i - 1][1], h[i][1], p)];
  }
  const z = h[h.length - 1]; return [z[0], z[1]];
}
const valAt = (list, t) => { let v = list[0][1], t0 = list[0][0]; for (const [tt, vv] of list) { if (tt <= t) { v = vv; t0 = tt; } else break; } return [v, t0]; };

const model = QUESTS.map((sc, si) => {
  const T = TL[si];
  const m = { sc, T, si, tr: {}, flags: {}, cam: [[T.start, state.cam]], fx: [], formAt: [], warn: [] };
  for (const id in ACTORS) {
    const s = state.a[id], p = NODES[s.node];
    m.tr[id] = { ev: [{ type: 'tp', t0: T.start, p }], hist: [[p[0], p[1], 0]], arc: 0, end: T.start, node: s.node,
      vis: [[T.start, s.vis]], item: [[T.start, s.item]], name: [[T.start, s.name]], emo: [], follow: null };
  }
  for (const k in state.f) m.flags[k] = [[T.start, state.f[k]]];
  const pushSorted = (list, e) => { list.push(e); list.sort((a, b) => a[0] - b[0]); };
  const tpAt = (tr, t, p, node) => {
    tr.ev.push({ type: 'tp', t0: t, p }); tr.ev.sort((a, b) => a.t0 - b.t0);
    tr.hist.push([p[0], p[1], tr.arc]); tr.end = Math.max(tr.end, t); tr.node = node;
  };
  const unfollow = (tr, t) => { if (!tr.follow) return; const p = posOf(tr, t); tr.follow = null; tpAt(tr, t, p, nearestNode(p)); };
  function run(act, base) {
    let at = base, s = act;
    const mm = act.match(/^(.*)@([a-z]\w*)?(\+?[\d.]+)?$/);
    if (mm && (mm[2] || mm[3])) { s = mm[1]; at = (mm[2] ? Math.max(base, m.tr[mm[2]].end) : base) + (mm[3] ? +mm[3] : 0); }
    let r;
    if ((r = s.match(/^cam:(.+)$/))) { pushSorted(m.cam, [at, r[1]]); return; }
    if ((r = s.match(/^\$(\w+)=(.*)$/))) { const v = r[2] === '' ? '' : isNaN(+r[2]) ? r[2] : +r[2]; pushSorted(m.flags[r[1]] || (m.flags[r[1]] = [[T.start, '']]), [at, v]); return; }
    if ((r = s.match(/^(\w+)(>>?)(\w+)$/))) {
      const tr = m.tr[r[1]], t0 = Math.max(at, tr.end);
      unfollow(tr, t0);
      const nodes = route(tr.node, r[3]), pts = nodes.map(n => NODES[n]);
      const cum = [0]; for (let i = 1; i < pts.length; i++) cum.push(cum[i - 1] + Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]));
      const len = cum[cum.length - 1], sp = r[2] === '>>' ? RUN : SPEED;
      tr.ev.push({ type: 'move', t0, t1: t0 + len / sp, pts, cum, len, sp, a0: tr.arc }); tr.ev.sort((a, b) => a.t0 - b.t0);
      for (let i = 1; i < pts.length; i++) tr.hist.push([pts[i][0], pts[i][1], tr.arc + cum[i]]);
      tr.arc += len; tr.end = t0 + len / sp; tr.node = r[3];
      if (!tr.vis.some(v => v[0] <= t0 && v[1])) pushSorted(tr.vis, [t0, true]);
      return;
    }
    if ((r = s.match(/^(\w+)=(\w+)$/))) { const tr = m.tr[r[1]]; unfollow(tr, at); tpAt(tr, at, NODES[r[2]], r[2]); pushSorted(tr.vis, [at, true]); if (at > T.start + 0.05) m.fx.push([at, r[1]]); return; }
    if ((r = s.match(/^(\w+):(show|hide)$/))) { pushSorted(m.tr[r[1]].vis, [at, r[2] === 'show']); return; }
    if ((r = s.match(/^(\w+)\.item=(\w*)$/))) { pushSorted(m.tr[r[1]].item, [at, r[2]]); return; }
    if ((r = s.match(/^(\w+)\.name=(.+)$/))) { pushSorted(m.tr[r[1]].name, [at, r[2]]); return; }
    if ((r = s.match(/^(\w+)!(.+)$/))) { m.tr[r[1]].emo.push([at, r[2]]); return; }
    if ((r = s.match(/^(\w+)~(\w*)$/))) {
      const tr = m.tr[r[1]];
      if (!r[2]) { unfollow(tr, at); return; }
      const L = m.tr[r[2]];
      tr.ev.push({ type: 'follow', t0: at, leader: L, p0: posOf(tr, at), a0: Math.max(0, arcOf(L, at) - GAP) }); tr.ev.sort((a, b) => a.t0 - b.t0);
      tr.follow = L; return;
    }
    throw new Error('bad action: ' + act);
  }
  for (const a of sc.init || []) run(a, T.start);
  sc.lines.forEach((l, li) => { for (const a of l.do || []) run(a, T.lines[li][0]); });
  // 場景結束時的狀態，交給下一關
  const next = { a: {}, f: {}, cam: m.cam[m.cam.length - 1][1] };
  for (const id in ACTORS) {
    const tr = m.tr[id];
    if (tr.follow) unfollow(tr, T.end);
    if (tr.end > T.end + 0.05) m.warn.push(`${id} 在場景結束時仍在移動 (+${(tr.end - T.end).toFixed(1)}s)`);
    next.a[id] = { node: tr.node, vis: valAt(tr.vis, 1e9)[0], item: valAt(tr.item, 1e9)[0], name: valAt(tr.name, 1e9)[0] };
  }
  for (const k in m.flags) next.f[k] = valAt(m.flags[k], 1e9)[0];
  state = next;
  // 任務步驟、表單、完成時間
  m.kAt = []; let k = 0;
  sc.lines.forEach((l, li) => { if (l.k != null && l.k > k) { k = l.k; m.kAt.push([T.lines[li][0], k]); } });
  m.clearAt = null;
  sc.lines.forEach((l, li) => { if (l.clear && m.clearAt == null) m.clearAt = T.lines[li][0]; });
  sc.lines.forEach((l, li) => {
    if (!l.form) return;
    const prev = sc.lines[li - 1];
    const startT = prev && prev.form === l.form ? m.formAt[m.formAt.length - 1].a : T.lines[li][0];
    if (prev && prev.form === l.form) m.formAt[m.formAt.length - 1].b = T.lines[li][1]; else m.formAt.push({ id: l.form, a: startT, b: T.lines[li][1] });
  });
  // 工程師所在區域（進入新區域時顯示提示）
  m.zoneAt = []; let lastZ = null;
  for (let t = T.start; t <= T.end; t += 0.1) {
    const rm = roomAt(posOf(m.tr.eng, t));
    const key = rm ? rm.z + rm.code : '';
    if (key !== lastZ) { m.zoneAt.push([t, rm]); lastZ = key; }
  }
  return m;
});
model.forEach(m => m.warn.forEach(w => console.warn(`場景 ${m.si}：${w}`)));
const TOTAL = TL[TL.length - 1].end;
const BADGE_AT = {};
for (const m of model) if (m.clearAt != null) for (const c of m.sc.annex || []) if (BADGE_AT[c] == null) BADGE_AT[c] = m.clearAt + 0.9;

/* ═════════════════════ 5. 建立畫面元素 ═════════════════════ */

const AC = {};
for (const id in ACTORS) {

const CCTV_VIEWS = [['CAM-01 大廳閘門', '330 200 220 140'], ['CAM-05 R-01 機房門口', '1040 360 200 128'], ['CAM-06 R-01 機櫃走道', '1170 220 260 166'], ['CAM-07 交付裝卸區', '900 570 360 230']];

      <div class="bl"><i>表單</i><div class="chips">${['L4-29', 'L4-30', 'L4-31', 'L4-32', 'L4-33', 'L4-61', 'L4-62', 'L4-63'].map(f => docChip(f, 'f')).join('')}</div></div></div>
    <div class="sec">ISO/IEC 27001:2022</div><div class="basis"><div class="bl"><i>運作流程</i><div class="chips">${docChip(`A07 ${OPS.A07}（${OPS_EN.A07}）`, 'o')}</div></div>

  if (sc.type === 'summary') return `<div class="qh"><span class="no">ALL CLEAR</span><span class="zpill" style="background:var(--sun)">16 / 16</span></div>
    <h3>附錄A 徽章總覽</h3><div class="sec">運作流程：A07 實體安全</div><div class="blist">${ANNEX_ORDER.map(c => `<div><span class="bdg got${c.length > 3 ? ' wide' : ''}">${c}</span><span>${esc(ANNEX[c])}</span></div>`).join('')}</div>
    <div class="credit">${esc(CREDIT)}</div>`;
  return `<div class="qh"><span class="no">QUEST ${String(sc.no).padStart(2, '0')}</span><span class="zpill" style="background:${zoneColor(sc.zone)}">${esc(zoneName(sc.zone))}</span></div>

  // 監視畫面、門禁紀錄
  const cctv = F('cctv'), log = F('log');
  show($('#cctv'), cctv[0]); if (cctv[0]) setS($('#cctv'), 'transform', `scale(${ease(clamp((t - cctv[1]) / 0.35)).toFixed(3)})`);
  show($('#log'), log[0]); if (log[0]) setS($('#log'), 'transform', `scale(${ease(clamp((t - log[1]) / 0.35)).toFixed(3)})`);
  W('logbad').className = F('logalert')[0] && Math.floor(t * 3) % 2 === 0 ? 'alert' : F('logalert')[0] ? 'alert' : '';
  setS(W('logbad'), 'opacity', F('logalert')[0] ? (0.6 + 0.4 * Math.abs(Math.sin(t * 6))).toFixed(2) : 1);
  // 開場、總結
  show($('#titleov'), sc.type === 'title' && t - T.start < (T.lines[4] ? T.lines[4][0] + 1.5 - T.start : 99));
  if (sc.type === 'title') setS($('#titleov'), 'opacity', clamp((T.lines[4][0] + 1.5 - t) / 0.8).toFixed(3));
  const sum = F('sum');
  show($('#sumov'), sc.type === 'summary' && sum[0]);
  if (sum[0]) {
    setS($('#sumov'), 'opacity', ease(clamp((t - sum[1]) / 0.6)).toFixed(3));
    const sr = F('sumrow')[0];
    document.querySelectorAll('#sumov tr').forEach((tr, i) => tr.classList.toggle('hl', (sr === 1 && i < 3) || (sr === 2 && i === 3)));
  }
  // 任務完成
  const clearEl = $('#clear');
  const cOn = m.clearAt != null && t >= m.clearAt && t < Math.min(m.clearAt + 3.6, T.end);
  show(clearEl, cOn);
  if (cOn) {
    if (clearEl._si !== si) { clearEl._si = si; clearEl.innerHTML = `<b>QUEST CLEAR!</b><div>獲得徽章 ${sc.annex.map(c => `<span class="bdg got${c.length > 3 ? ' wide' : ''}">${c}</span>${esc(ANNEX[c])}`).join('　')}</div>`; }
    const k = clamp((t - m.clearAt) / 0.4), out = clamp((m.clearAt + 3.6 - t) / 0.4);
    setS(clearEl, 'opacity', out.toFixed(3)); setS(clearEl, 'transform', `translate(-50%, -50%) scale(${(0.6 + 0.4 * ease(k) + Math.sin(k * Math.PI) * 0.12).toFixed(3)})`);
  }
  // HUD 徽章
  for (const c of ANNEX_ORDER) {
    const at = BADGE_AT[c], got = at != null && t >= at;
    if (BD[c]._g !== got) { BD[c]._g = got; BD[c].classList.toggle('got', got); }
    const pk = got ? clamp(1 - (t - at) / 1.4) : 0;
    setS(BD[c], 'transform', pk ? `scale(${(1 + Math.sin(pk * Math.PI * 3) * 0.25 * pk + pk * 0.2).toFixed(3)})` : '');
  }
  badgesEl.classList.toggle('hl', !!F('hud')[0]);

  /* 任務卡：步驟打勾、附錄A強調 */
  let li = -1; T.lines.forEach(([a], k) => { if (t >= a - 0.05) li = k; });
  if (sc.type === 'quest') {
    let k = 0; for (const [kt, kk] of m.kAt) if (t >= kt + 0.4) k = kk;
    const line = li >= 0 ? sc.lines[li] : null;
    m.stepEls.forEach((el, i) => {
      const done = i < k;
      if (el._d !== done) { el._d = done; el.classList.toggle('done', done); $('.cb', el).textContent = done ? '✔' : ''; }
      el.classList.toggle('now', !!(line && line.k === i + 1 && t - T.lines[li][0] < 3));
    });
    const lit = m.clearAt != null && t >= m.clearAt;
    m.annexEls.forEach(el => el.classList.toggle('on', lit));
  }

  /* 對話框 */
  const line = li >= 0 ? sc.lines[li] : null;
  const [ls, le] = li >= 0 ? T.lines[li] : [0, 0];
  const speaking = line && t >= ls && t <= le;
  const box = $('#dlgbox');
  const key = si + ':' + li;
  if (key !== curLine) { curLine = key; if (line) { box.className = 'box ' + line.s; $('#who').textContent = line.s === 'A' ? 'Allan 老師（關主）' : '阿拉蕾（玩家）'; } }
  if (line) {
    const n = Math.min(line.t.length, Math.floor((t - ls) * 16) + 1);
    const s = line.t.slice(0, Math.max(0, n));
    if ($('#txt')._s !== s) { $('#txt')._s = s; $('#txt').textContent = s; }
    show($('#more'), n >= line.t.length && Math.floor(t * 2.5) % 2 === 0);
  } else { if ($('#txt')._s !== '') { $('#txt')._s = ''; $('#txt').textContent = ''; } show($('#more'), false); }
  for (const s of ['A', 'R']) {
    const c = P[s], me = line && line.s === s, talk = me && speaking, e = me ? line.e || '' : '';
    let f = IDLE[s];
    if (talk) f = e && c.faces[e] ? e : TALK[s][Math.floor((t - ls) / 0.85 + li * 0.5) % 2];
    else if (me && e && c.faces[e]) f = e;
    showFace(c, f);
    let y = Math.sin(t * 2.1 + (s === 'R' ? 1.7 : 0)) * 2;
    if (me && ['wow', 'excited', 'laugh', 'cry'].includes(e)) y -= Math.abs(Math.sin((t - ls) * 7)) * 12 * clamp(1 - (t - ls) / 1.2);
    setS(c.sprite, 'transform', `translateY(${y.toFixed(2)}px) scale(${me ? 1 : 0.94})`);
    setS(c.el, 'opacity', me || !line ? 1 : 0.55);
  }
  setS($('#prog'), 'width', (t / TOTAL * 100).toFixed(3) + '%');
}
window.renderAt = renderAt;
window.TIMELINE = TL;
window.TOTAL_DURATION = TOTAL;

/* ═════════════════════ 7. 播放器 ═════════════════════ */
const audio = $('#audio'), playBtn = $('#play'), seek = $('#seek'), clock = $('#clock');
let fallback = typeof TIMING === 'undefined', fbStart = 0, fbT = 0, fbPlaying = false;
audio.addEventListener('error', () => { fallback = true; });
const fmt = s => `${Math.floor(s / 60)}:${String(Math.floor(s % 60)).padStart(2, '0')}`;
const now = () => fallback ? (fbPlaying ? fbT + (performance.now() - fbStart) / 1000 : fbT) : audio.currentTime;
const playing = () => fallback ? fbPlaying : !audio.paused;
function play() { $('#start').hidden = true; if (fallback) { fbStart = performance.now(); fbPlaying = true; } else audio.play().catch(() => { fallback = true; fbT = audio.currentTime || 0; play(); }); }
function pause() { if (fallback) { fbT = now(); fbPlaying = false; } else audio.pause(); }
function go(t) { t = clamp(t, 0, TOTAL); if (fallback) { fbT = t; fbStart = performance.now(); } else audio.currentTime = t; renderAt(t); }

if (!RENDER) {
  const chEl = $('#chapters');
  model.forEach((m, i) => {
    const b = document.createElement('button');
    b.type = 'button'; b.dataset.s = i;
    const sc = m.sc;
    const dot = sc.type === 'quest' ? `<i style="background:${sc.zone === 'ALL' ? '#fff' : ZONES[sc.zone].chip}"></i>` : '';
    b.innerHTML = dot + esc(sc.type === 'title' ? '開場' : sc.type === 'summary' ? '全破總結' : `${sc.no}. ${sc.title.split('：')[0]}`);
    b.onclick = () => { go(m.T.start); if (!playing()) play(); };
    chEl.appendChild(b);
  });
  $('#start').onclick = play;
  playBtn.onclick = () => playing() ? pause() : play();
  const sceneOf = t => Math.max(0, model.findIndex(m => t < m.T.end));
  $('#prev').onclick = () => { const t = now(), si = sceneOf(t); go(model[t - model[si].T.start > 2 ? si : Math.max(0, si - 1)].T.start); };
  $('#next').onclick = () => go(model[Math.min(model.length - 1, sceneOf(now()) + 1)].T.start);
  seek.oninput = () => go(seek.value / 1000 * TOTAL);
  // 嵌入網頁（如 Google Sites）時若不允許全螢幕，改為另開新視窗
  const IN_FRAME = (() => { try { return window.self !== window.top; } catch (e) { return true; } })();
  const popOut = () => { pause(); window.open(location.href, '_blank', 'noopener'); };
  if (IN_FRAME && !document.fullscreenEnabled) { $('#fs').textContent = '⤢'; $('#fs').title = '以新視窗開啟'; $('#fs').setAttribute('aria-label', '以新視窗開啟'); }
  $('#fs').onclick = () => {
    const v = $('#viewport');
    if (document.fullscreenElement) { document.exitFullscreen().catch(() => {}); return; }
    if (!document.fullscreenEnabled || !v.requestFullscreen) { if (IN_FRAME) popOut(); return; }
    v.requestFullscreen().catch(() => { if (IN_FRAME) popOut(); });
  };
  document.addEventListener('keydown', e => {
    if (e.target.tagName === 'INPUT' && e.key !== ' ') return;
    if (e.key === ' ') { e.preventDefault(); playing() ? pause() : play(); }
    else if (e.key === 'ArrowRight') go(now() + 5);
    else if (e.key === 'ArrowLeft') go(now() - 5);
  });
  const fit = () => { const v = $('#viewport'); $('#stage').style.transform = `scale(${v.clientWidth / 1280})`; };
  addEventListener('resize', fit); new ResizeObserver(fit).observe($('#viewport')); fit();
  const loop = () => {
    const t = now();
    if (fallback && t >= TOTAL) { fbPlaying = false; fbT = TOTAL; }
    renderAt(t);
    if (document.activeElement !== seek) seek.value = Math.round(t / TOTAL * 1000);
    clock.textContent = `${fmt(t)} / ${fmt(TOTAL)}`;
    playBtn.textContent = playing() ? '⏸' : '▶';
    requestAnimationFrame(loop);
  };
  renderAt(2.5); loop();
} else {
  renderAt(0);
}
})();
</script>
