<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>實體安全大冒險｜互動闖關版</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Huninn&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* 互動闖關版：1280×720 遊戲畫面依視窗等比縮放。左側 900×664 為可操控的平面圖，右側為任務卡，上方為徽章與合規分數 */
:root {
  --hall: #0B1220; --hall-fg: #DCE7F5; --hall-dim: #8193AE;
  --hud: #111B2E; --panel: #14223A; --panel-2: #1B2D4B; --panel-line: #2B4166;
  --ink: #0F172A; --mint: #16C47F; --mint-hi: #2BF0A6; --sun: #FFC53D; --alert: #F43F5E; --ok: #22C55E;
  --paper: #FFFDF6; --paper-2: #F3EEDD; --paper-line: #E5E0D0;
  --f-display: 'Huninn', 'Noto Sans TC', 'WenQuanYi Zen Hei', sans-serif;
  --f-body: 'Noto Sans TC', 'WenQuanYi Zen Hei', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--hall); color: var(--hall-fg); font-family: var(--f-body); overflow: hidden; }
* { box-sizing: border-box; }
button { font-family: var(--f-body); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--mint-hi); outline-offset: 2px; }
.wrap { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
.viewport { position: relative; overflow: hidden; background: var(--hud); box-shadow: 0 20px 60px rgba(0,0,0,.5); }
#stage { position: absolute; left: 0; top: 0; width: 1280px; height: 720px; transform-origin: 0 0; overflow: hidden; background: var(--hud); user-select: none; -webkit-user-select: none; }

/* ── HUD ── */
.hud { position: absolute; left: 0; top: 0; width: 1280px; height: 56px; display: flex; align-items: center; gap: 12px; padding: 0 14px; background: linear-gradient(180deg, #16223A, #0F192B); border-bottom: 2px solid #22375A; }
.logo { display: flex; flex-direction: column; line-height: 1.05; min-width: 200px; }
.logo b { font: 400 23px var(--f-display); color: var(--sun); text-shadow: 0 2px 0 #7A4A00; white-space: nowrap; }
.logo small { font: 500 11px var(--f-body); color: var(--hall-dim); letter-spacing: .04em; margin-top: 3px; white-space: nowrap; }
.badges { display: flex; gap: 4px; padding: 4px 7px; border-radius: 10px; background: rgba(0,0,0,.25); border: 1px solid #22375A; }
.bdg { width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; font: 900 11.5px var(--f-body); color: #4B5D7C; clip-path: polygon(50% 0, 93% 25%, 93% 75%, 50% 100%, 7% 75%, 7% 25%); background: #1C2A44; flex: none; }
.bdg.got { color: #3B2A00; background: linear-gradient(160deg, #FFE48A, #FFC53D 55%, #E39B0B); }
.bdg.wide { font-size: 10.5px; }
.bdg.pop { animation: pop .9s ease-out; }
@keyframes pop { 0% { transform: scale(1.8); } 60% { transform: scale(.9); } 100% { transform: scale(1); } }
.score { margin-left: auto; display: flex; gap: 14px; align-items: center; }
.score div { text-align: right; line-height: 1.05; }
.score b { font: 400 22px var(--f-display); color: #fff; font-variant-numeric: tabular-nums; }
.score b.bad { color: var(--alert); }
.score small { display: block; font: 500 11px var(--f-body); color: var(--hall-dim); }

/* ── 地圖 ── */
.map { position: absolute; left: 0; top: 56px; width: 900px; height: 664px; overflow: hidden; background: #C9D0D4; cursor: pointer; touch-action: none; }
.map.finding { cursor: crosshair; }
#world { position: absolute; left: 0; top: 0; width: 900px; height: 664px; display: block; }
.ov { position: absolute; left: 0; top: 0; width: 900px; height: 664px; pointer-events: none; }
.rl { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 5px; font: 700 12px/1 var(--f-body); color: var(--ink); background: rgba(255,255,255,.88); border-radius: 6px; padding: 3px 7px 3px 3px; white-space: nowrap; box-shadow: 0 1px 3px rgba(0,0,0,.18); }
.rl i { font-style: normal; font: 900 10px/1 var(--f-body); padding: 3px 5px; border-radius: 4px; color: #fff; }
.rl.W i { background: #64748B; } .rl.G i { background: #16A34A; } .rl.Y i { background: #CA8A04; } .rl.R i { background: #E11D48; }
.tag { position: absolute; left: 0; top: 0; font: 700 11px/1 var(--f-body); color: #fff; padding: 3px 6px; border-radius: 999px; white-space: nowrap; box-shadow: 0 1px 2px rgba(0,0,0,.3); }
.tag.me { box-shadow: 0 0 0 2px #fff, 0 1px 3px rgba(0,0,0,.4); }
.emo { position: absolute; left: 0; top: 0; width: 36px; height: 36px; display: flex; align-items: center; justify-content: center; background: #fff; border: 2.5px solid var(--ink); border-radius: 50%; font: 900 20px/1 var(--f-body); color: var(--alert); transform-origin: 50% 100%; }
.emo::after { content: ''; position: absolute; bottom: -7px; left: 50%; margin-left: -5px; border: 5px solid transparent; border-top-color: var(--ink); border-bottom: 0; }
.mark-ok { position: absolute; left: 0; top: 0; width: 30px; height: 30px; margin: -15px 0 0 -15px; border-radius: 50%; background: var(--ok); color: #fff; font: 900 18px/30px var(--f-body); text-align: center; box-shadow: 0 0 0 3px #fff, 0 3px 8px rgba(0,0,0,.35); }
.hint-ring { position: absolute; left: 0; top: 0; border-radius: 50%; border: 3px dashed var(--sun); box-shadow: 0 0 12px rgba(255,197,61,.8); }
.night { position: absolute; inset: 0; background: rgba(12,20,70,.5); pointer-events: none; }
.rain { position: absolute; inset: -40px; pointer-events: none; background-image: repeating-linear-gradient(105deg, rgba(200,225,255,0) 0 22px, rgba(200,225,255,.5) 22px 23.5px, rgba(200,225,255,0) 23.5px 46px); }
.loc { position: absolute; right: 10px; bottom: 10px; display: flex; align-items: center; gap: 8px; font: 700 14px var(--f-body); color: #fff; background: rgba(15,23,42,.86); border-radius: 10px; padding: 6px 10px; border-left: 6px solid #4ADE80; pointer-events: none; }
.loc small { font-weight: 500; color: #B6C4DA; }
.toast { position: absolute; left: 50%; top: 14px; transform: translateX(-50%); font: 400 22px var(--f-display); padding: 7px 20px; border-radius: 12px; color: var(--ink); white-space: nowrap; border: 3px solid var(--ink); box-shadow: 0 4px 0 rgba(15,23,42,.45); pointer-events: none; max-width: 860px; overflow: hidden; text-overflow: ellipsis; }
.toast small { font: 700 13.5px var(--f-body); margin-left: 10px; }
.msg { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); max-width: 700px; font: 700 15px/1.45 var(--f-body); color: #fff; background: rgba(15,23,42,.92); border: 2px solid var(--sun); border-radius: 12px; padding: 9px 16px; text-align: center; pointer-events: none; }
.legend { position: absolute; left: 10px; bottom: 10px; display: flex; flex-direction: column; gap: 4px; background: rgba(255,255,255,.93); color: var(--ink); border-radius: 10px; padding: 7px 9px; font: 700 11.5px var(--f-body); transform-origin: 0 100%; box-shadow: 0 2px 6px rgba(0,0,0,.2); pointer-events: none; }
.legend .r { display: flex; gap: 8px; align-items: center; white-space: nowrap; }
.legend .z { display: inline-flex; align-items: center; gap: 3px; }
.legend .z b { width: 13px; height: 13px; border-radius: 3px; border: 1.5px solid rgba(0,0,0,.35); display: inline-block; }
.legend svg { width: 13px; height: 13px; vertical-align: -2px; }
.legend.hl { transform: scale(1.35); box-shadow: 0 0 0 3px var(--sun), 0 6px 18px rgba(0,0,0,.3); }
.offarrow { position: absolute; left: 0; top: 0; width: 46px; height: 46px; margin: -23px 0 0 -23px; pointer-events: none; }
.findbar { position: absolute; left: 50%; top: 66px; transform: translateX(-50%); display: flex; align-items: center; gap: 12px; background: rgba(15,23,42,.94); border: 2px solid var(--sun); border-radius: 12px; padding: 8px 10px 8px 16px; color: #fff; font: 700 15px var(--f-body); white-space: nowrap; }
.findbar b { color: var(--sun); font-variant-numeric: tabular-nums; }
.findbar button { font: 700 13px var(--f-body); border-radius: 8px; padding: 6px 10px; border: 0; cursor: pointer; background: var(--sun); color: var(--ink); }
.findbar button.ghost { background: transparent; color: #CFE0F5; border: 1px solid #3B5277; }
.mapbtn { position: absolute; right: 10px; top: 10px; display: flex; gap: 6px; }
.mapbtn button { font: 700 12.5px var(--f-body); color: #fff; background: rgba(15,23,42,.85); border: 1px solid #3B5277; border-radius: 8px; padding: 6px 10px; cursor: pointer; }
.mapbtn button.on { background: var(--sun); color: var(--ink); border-color: var(--sun); }

/* 監視畫面 */
.cctv { position: absolute; right: 12px; top: 54px; width: 420px; background: #0B1220; border: 2px solid #334155; border-radius: 10px; padding: 8px; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; box-shadow: 0 10px 28px rgba(0,0,0,.4); pointer-events: none; }
.cctv .h { grid-column: 1 / -1; display: flex; justify-content: space-between; font: 700 12px var(--f-body); color: #93C5FD; }
.cctv .h b { color: #F87171; }
.cctv .cam { position: relative; height: 112px; border-radius: 6px; overflow: hidden; background: #000; }
.cctv .cam svg { width: 100%; height: 100%; display: block; filter: grayscale(1) contrast(1.15); }
.cctv .cam span { position: absolute; left: 5px; top: 4px; font: 700 10px var(--f-body); color: #fff; background: rgba(0,0,0,.55); padding: 1px 4px; border-radius: 3px; }

/* ── 對話框（地圖下方） ── */
.dlg { position: absolute; left: 10px; right: 10px; bottom: 10px; height: 150px; cursor: pointer; }
.dlg .pt { position: absolute; bottom: 0; width: 150px; height: 150px; }
.dlg .pt img { position: absolute; left: 50%; bottom: 0; height: 150px; transform: translateX(-50%); pointer-events: none; }
.dlg.A .pt { left: 0; } .dlg.R .pt { right: 0; }
.dlg .box { position: absolute; top: 8px; bottom: 0; border: 3px solid #E2E8F0; border-radius: 14px; background: rgba(20,34,58,.97); padding: 14px 18px 10px; box-shadow: 0 8px 24px rgba(0,0,0,.4), inset 0 0 0 3px #0B1322; }
.dlg.A .box { left: 146px; right: 0; } .dlg.R .box { left: 0; right: 146px; }
.dlg .who { position: absolute; top: -14px; left: 16px; font: 700 14px var(--f-body); color: var(--ink); background: var(--mint-hi); padding: 3px 12px; border-radius: 999px; border: 2px solid #0B1322; }
.dlg.R .who { left: auto; right: 16px; background: var(--sun); }
.dlg .txt { font: 400 21px/1.5 var(--f-display); color: #fff; text-wrap: pretty; }
.dlg .more { position: absolute; right: 14px; bottom: 6px; color: var(--sun); font: 700 12.5px var(--f-body); animation: blink 1s steps(2) infinite; }
@keyframes blink { 50% { opacity: .2; } }

/* ── 互動視窗 ── */
.modal { position: absolute; inset: 0; background: rgba(8,14,28,.62); display: flex; align-items: center; justify-content: center; padding: 18px; cursor: default; }
.card { width: 680px; max-height: 628px; overflow: auto; color-scheme: light; background: var(--paper); color: var(--ink); border-radius: 14px; border: 3px solid #1E293B; box-shadow: 0 18px 50px rgba(0,0,0,.5); }
.card .ch { display: flex; align-items: center; gap: 10px; padding: 10px 16px; background: #1E293B; color: #fff; position: sticky; top: 0; z-index: 1; }
.card .ch i { font: 900 12px var(--f-body); font-style: normal; background: var(--sun); color: var(--ink); padding: 3px 7px; border-radius: 5px; white-space: nowrap; }
.card .ch b { font: 700 16px var(--f-body); }
.card .ch span { margin-left: auto; font: 700 12px var(--f-body); color: #9FB3D1; }
.card .cb { padding: 14px 18px 16px; display: flex; flex-direction: column; gap: 10px; }
.card .q { font: 700 18px/1.45 var(--f-body); color: var(--ink); }
.opt { display: flex; gap: 10px; align-items: flex-start; text-align: left; width: 100%; font: 500 16px/1.45 var(--f-body); color: var(--ink); background: #fff; border: 2px solid #D6D0BE; border-radius: 10px; padding: 10px 12px; cursor: pointer; }
.opt:hover { border-color: #64748B; }
.opt .k { flex: none; width: 26px; height: 26px; border-radius: 50%; background: #E2E8F0; font: 900 14px/26px var(--f-body); text-align: center; color: #334155; }
.opt.sel { border-color: #2563EB; background: #EFF6FF; }
.opt.sel .k { background: #2563EB; color: #fff; }
.opt.right { border-color: var(--ok); background: #ECFDF5; }
.opt.right .k { background: var(--ok); color: #fff; }
.opt.wrong { border-color: var(--alert); background: #FFF1F2; }
.opt.wrong .k { background: var(--alert); color: #fff; }
.opt.miss { border-color: #F59E0B; border-style: dashed; }
.opt[disabled] { cursor: default; }
.fb { border-radius: 10px; padding: 10px 12px; font: 500 15px/1.55 var(--f-body); }
.fb.ok { background: #ECFDF5; border: 2px solid #86EFAC; color: #065F46; }
.fb.no { background: #FFF1F2; border: 2px solid #FDA4AF; color: #9F1239; }
.fb b { font-weight: 900; }
.ref { font: 700 12.5px var(--f-body); color: #5B6B82; }
.acts { display: flex; justify-content: flex-end; gap: 8px; }
.btn { font: 700 15px var(--f-body); border: 0; border-radius: 10px; padding: 10px 18px; cursor: pointer; background: #1E293B; color: #fff; }
.btn.go { background: var(--mint); color: var(--ink); }
.btn.alt { background: #E2E8F0; color: var(--ink); }
.btn[disabled] { opacity: .45; cursor: default; }
.tbl { width: 100%; border-collapse: collapse; font: 500 14px/1.4 var(--f-body); }
.tbl td, .tbl th { border-bottom: 1px solid var(--paper-line); padding: 7px 9px; text-align: left; vertical-align: middle; }
.tbl th { background: var(--paper-2); font-weight: 700; font-size: 13px; }
.tbl td.k { width: 190px; font-weight: 700; color: #475569; background: #FAF6EA; }
.tbl tr.bad td { background: #FFE4E6; }
.tbl tr.good td { background: #ECFDF5; }
.tbl select { font: 500 14px var(--f-body); padding: 5px 6px; border-radius: 6px; border: 1.5px solid #CBD5E1; background: #fff; color: var(--ink); max-width: 100%; }
.tbl label { display: inline-flex; align-items: center; gap: 5px; margin: 2px 12px 2px 0; cursor: pointer; }
.tbl input { width: 17px; height: 17px; accent-color: #2563EB; }
.tbl .std { color: #64748B; font-size: 12.5px; }
.judge { display: inline-flex; border: 1.5px solid #CBD5E1; border-radius: 8px; overflow: hidden; }
.judge button { font: 700 13.5px var(--f-body); border: 0; background: #fff; color: #334155; padding: 5px 12px; cursor: pointer; }
.judge button.on.n { background: var(--ok); color: #fff; } .judge button.on.a { background: var(--alert); color: #fff; }
.stamp { align-self: flex-end; font: 900 18px var(--f-body); color: #DC2626; border: 3px solid #DC2626; border-radius: 8px; padding: 3px 10px; transform: rotate(-8deg); letter-spacing: .08em; animation: pop .5s ease-out; }
.pin { display: grid; grid-template-columns: repeat(3, 72px); gap: 8px; justify-content: center; }
.pin button { height: 56px; font: 900 22px var(--f-body); border-radius: 10px; border: 2px solid #CBD5E1; background: #fff; color: var(--ink); cursor: pointer; }
.pin .disp { grid-column: 1 / -1; height: 52px; border-radius: 10px; background: #0F172A; color: #22C55E; font: 900 30px/52px var(--f-body); text-align: center; letter-spacing: .4em; }
.mlist { display: flex; flex-direction: column; gap: 6px; }
.mlist button { display: grid; grid-template-columns: 34px 14px 1fr auto; gap: 10px; align-items: center; text-align: left; font: 500 15px var(--f-body); color: var(--ink); background: #fff; border: 2px solid #E2DDCC; border-radius: 10px; padding: 8px 12px; cursor: pointer; }
.mlist button b { font: 400 17px var(--f-display); color: #0C7A63; }
.mlist button i { width: 14px; height: 14px; border-radius: 3px; border: 1px solid rgba(0,0,0,.35); }
.mlist button em { font-style: normal; font: 700 12.5px var(--f-body); color: #64748B; }
.mlist button.done em { color: #047857; }
.mlist button.cur { border-color: var(--sun); background: #FFFBEB; }
.help { font: 500 15px/1.7 var(--f-body); }
.help kbd { display: inline-block; font: 700 12.5px var(--f-body); background: #1E293B; color: #fff; border-radius: 5px; padding: 1px 7px; margin: 0 2px; }
.rep-sum { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.rep-sum div { background: #fff; border: 2px solid var(--paper-line); border-radius: 10px; padding: 10px; text-align: center; }
.rep-sum b { display: block; font: 400 30px var(--f-display); color: #0C7A63; }
.rep-sum b.bad { color: #DC2626; }
.rep-sum span { font: 700 12.5px var(--f-body); color: #64748B; }
.verdict { font: 700 16px/1.5 var(--f-body); padding: 10px 12px; border-radius: 10px; background: #FFFBEB; border: 2px solid #FCD34D; }
.nc { border: 2px solid #FDA4AF; border-radius: 10px; padding: 9px 12px; background: #fff; font: 500 14px/1.55 var(--f-body); }
.nc b { color: #9F1239; }
.nc .r { color: #475569; }

/* ── 任務卡 ── */
.quest { position: absolute; left: 900px; top: 56px; width: 380px; height: 664px; background: var(--panel); border-left: 2px solid #22375A; padding: 12px 14px 10px; display: flex; flex-direction: column; gap: 7px; overflow: hidden; }
.qh { display: flex; align-items: center; justify-content: space-between; }
.qh .no { font: 400 18px var(--f-display); color: var(--mint-hi); letter-spacing: .08em; }
.zpill { font: 900 12px var(--f-body); color: var(--ink); padding: 4px 9px; border-radius: 999px; border: 2px solid rgba(0,0,0,.25); }
.quest h3 { margin: 0; font: 400 23px/1.2 var(--f-display); color: #fff; }
.goal { border: 2px solid var(--sun); border-radius: 10px; background: rgba(255,197,61,.1); padding: 8px 10px; }
.goal small { display: block; font: 700 11.5px var(--f-body); color: var(--sun); letter-spacing: .08em; }
.goal div { font: 700 15.5px/1.4 var(--f-body); color: #fff; margin-top: 2px; }
.meta { display: flex; flex-direction: column; gap: 2px; font: 500 12.5px/1.35 var(--f-body); color: #B6C4DA; }
.meta b { color: var(--sun); font-weight: 700; margin-right: 4px; }
.sec { display: flex; align-items: center; gap: 8px; font: 700 12px var(--f-body); color: var(--sun); letter-spacing: .06em; margin-top: 2px; }
.sec::after { content: ''; flex: 1; border-top: 1px dashed var(--panel-line); }
.steps { display: flex; flex-direction: column; gap: 3px; margin: 0; padding: 0; list-style: none; }
.steps li { display: grid; grid-template-columns: 20px 1fr; gap: 8px; align-items: center; font: 500 13.5px/1.3 var(--f-body); color: #8FA2BF; padding: 3px 6px; border-radius: 7px; }
.steps li .cb { width: 19px; height: 19px; border-radius: 5px; border: 2px solid #4B6189; display: flex; align-items: center; justify-content: center; font: 900 13px/1 var(--f-body); color: var(--ink); }
.steps li.done { color: #fff; } .steps li.done .cb { background: var(--mint); border-color: var(--mint); }
.steps li.now { background: rgba(255,197,61,.14); color: #fff; } .steps li.now .cb { border-color: var(--sun); }
.basis { display: flex; flex-direction: column; gap: 5px; }
.bl { display: grid; grid-template-columns: 52px 1fr; gap: 6px; align-items: start; }
.bl > i { font: 700 11.5px/20px var(--f-body); font-style: normal; color: var(--hall-dim); }
.bl p { margin: 0 0 2px; font: 500 12.5px/1.4 var(--f-body); color: #DCE7F5; }
.bl p b { color: #fff; font-weight: 900; margin-right: 4px; }
.bl p em { font-style: normal; color: var(--sun); font-weight: 700; margin-left: 4px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font: 700 12px/1 var(--f-body); padding: 5px 7px; border-radius: 6px; background: var(--panel-2); color: #DCE7F5; border: 1px solid var(--panel-line); white-space: nowrap; }
.chip.f { background: #FFF7D6; color: #5B3B00; border-color: #E8C35A; }
.chip.o { background: #2A1F4A; color: #D8CCFF; border-color: #5B4A9A; }
.ctl { padding: 6px 8px; border-radius: 8px; background: #12392F; border: 1px solid #1F6B55; }
.ctl b { display: block; font: 900 13.5px/1.3 var(--f-body); color: var(--mint-hi); }
.ctl p { margin: 2px 0 0; font: 500 11.5px/1.45 var(--f-body); color: #CFE9DF; }
.ctl.got { box-shadow: 0 0 0 2px var(--sun); }
.quest.tight { gap: 5px; }
.quest.tight h3 { font-size: 21px; }
.quest.tight .steps li { font-size: 12.5px; padding: 2px 6px; }
.quest.tight .bl p { font-size: 11.5px; line-height: 1.35; }
.quest.tight .ctl { padding: 4px 8px; }
.quest.tight .ctl p { font-size: 11px; line-height: 1.38; }
.quest.tight .chip { font-size: 11px; padding: 4px 6px; }
.quest.tighter { gap: 4px; padding-top: 10px; }
.quest.tighter h3 { font-size: 19px; }
.quest.tighter .goal { padding: 5px 9px; }
.quest.tighter .goal div { font-size: 14px; }
.quest.tighter .steps li { font-size: 12px; padding: 1px 6px; }
.quest.tighter .ctl p { font-size: 10.5px; line-height: 1.32; }
